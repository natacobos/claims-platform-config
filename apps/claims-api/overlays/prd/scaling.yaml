apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: claims-api
spec:
  minReplicas: 6
  maxReplicas: 12
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-api
spec:
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: "2"
              memory: 256Mi

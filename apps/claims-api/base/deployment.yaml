apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-api
  labels:
    app: claims-api
spec:
  selector:
    matchLabels:
      app: claims-api
  template:
    metadata:
      labels:
        app: claims-api
    spec:
      containers:
        - name: api
          image: platformacr.azurecr.io/claims-api:2.14.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ConnectionStrings__ClaimsDb
              valueFrom:
                secretKeyRef:
                  name: claims-api-db
                  key: connection-string
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

# Copies the database connection string from Azure Key Vault into the Kubernetes secret "claims-api-db".
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: claims-api-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: claims-api-db
  data:
    - secretKey: connection-string
      remoteRef:
        key: claims-db-connection-dev
